# Reproducible PostgreSQL development environment (Spec §18.7 / §18.9).
# Docker Compose automatically loads a root-level `.env` file when invoked from this
# directory, which supplies the POSTGRES_* values below. Copy .env.example to .env first.
#
# Creates two databases on first boot: POSTGRES_DB (development) and POSTGRES_TEST_DB
# (dedicated test database, created by docker/init-test-db.sh) — see backend/tests/conftest.py
# for why integration tests must never run against the development database.

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18's official image changed its expected data mount point:
      # a single mount at /var/lib/postgresql (not .../data) is now required,
      # so the image can lay out major-version-specific subdirectories for
      # pg_ctlcluster-style in-place upgrades. See
      # https://github.com/docker-library/postgres/pull/1259
      - pgdata:/var/lib/postgresql
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
