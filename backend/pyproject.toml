[project]
name = "food-ops-platform-backend"
version = "0.1.0"
description = "Food Operations Platform — backend (FastAPI, SQLAlchemy, PostgreSQL)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.12",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic's script template imports `op`/`sa` for every migration; a no-op
# bootstrap revision legitimately doesn't use them.
"migrations/versions/*.py" = ["F401", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
